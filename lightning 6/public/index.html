<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lightning AI 7</title>
<meta name="description" content="Lightning AI — chat, generate images and build apps.">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#0b0e14;color:#e8ecf4}
.view{display:none;width:100%;height:100%;border:0}
.view.active{display:block}
#licences{overflow:auto;padding:28px;white-space:pre-wrap;font:14px/1.6 ui-monospace,Consolas,monospace;background:#0b0e14;color:#e8ecf4}
</style>
</head>
<body>
<iframe id="app" class="view" title="Lightning app" allow="clipboard-read; clipboard-write; microphone; camera; fullscreen; autoplay"></iframe>
<iframe id="about" class="view active" title="About Lightning"></iframe>
<main id="licences" class="view"></main>
<script>
const licenceText = "LIGHTNING 6.0 — COPYRIGHT AND THIRD-PARTY NOTICES\n=====================================================\n\nCopyright (c) 2026 Ray. All rights reserved.\n\nPROPRIETARY PROJECT NOTICE\n--------------------------\nThe original Lightning 6.0 source code, interface, original artwork, branding,\ndesign, and project materials are proprietary.\n\nYou may not copy, reproduce, redistribute, republish, sell, sublicense, or\ncreate derivative versions of the original Lightning project or its original\nmaterials without prior written permission from the copyright holder.\n\nViewing or using the hosted website does not grant permission to copy or\nredistribute the original project source, design, branding, or artwork.\n\nThis notice does not override the separate licences that apply to third-party\nsoftware, fonts, libraries, APIs, models, or services. Those components remain\nunder their respective owners' terms and licences, listed below.\n\nTHIRD-PARTY SOFTWARE AND SERVICES\n---------------------------------\nlightning does not bundle the items below. The browser loads them at runtime\nfrom their own servers, and each keeps its own licence and terms.\n\n- Google Fonts: DM Sans, Source Serif 4, JetBrains Mono — SIL Open Font License 1.1\n- pdf.js (PDF reading) — Apache License 2.0\n- mammoth.js (Word .docx reading) — BSD 2-Clause\n- SheetJS Community Edition (Excel reading) — Apache License 2.0\n- JSZip (ZIP / PowerPoint reading) — MIT or GPL-3.0 (dual licensed)\n- Pyodide (in-browser Python) — Mozilla Public License 2.0\n- Google Translate website widget — Google Terms of Service\n\nAI and image services (OpenRouter, Groq, Google Gemini API, Cloudflare Workers AI,\nHugging Face and Together AI) are used under their own terms of service.\nContent created with them may be subject to the model and provider licences.\n\nThe pixel-art icons were drawn for this project and are covered by the\nproprietary project notice above.\n\nFor permission requests, contact the project owner through the project's\nofficial contact channel.\n";
const appFrame = document.getElementById("app");
const aboutFrame = document.getElementById("about");
document.getElementById("licences").textContent = licenceText;
aboutFrame.src = "/about.html";

function showView() {
  const chatUrl = /^\/chats\/[^/]+\/?$/.test(location.pathname);
  const friendsRoute = location.hash === "#friends";
  const chatRequested = location.hash === "#chat";
  const page = location.hash === "#licences" ? "licences"
    : (location.hash === "#about" || location.hash === "#account") ? "about"
    : (chatRequested || friendsRoute || chatUrl) ? "app" : "about";
  const wanted = chatUrl
    ? "/lightning.html?chat=" + encodeURIComponent(location.pathname)
    : friendsRoute ? "/lightning.html?open=friends" : "/lightning.html";
  if (appFrame.getAttribute("src") !== wanted) appFrame.src = wanted;
  document.querySelectorAll(".view").forEach(view => view.classList.toggle("active", view.id === page));
  if (page === "about" && location.hash === "#account") {
    try { aboutFrame.contentWindow.location.hash = "account"; } catch (e) {}
  }
}
window.addEventListener("hashchange", showView);
window.addEventListener("popstate", showView);
showView();
</script>
</body>
</html>
